<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Links Profile</title>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- main container start  -->
    <main>
      <article class="profile-card">
        <!-- image container -->
        <div class="img-c">
          <img src="./assets/images/avatar-jessica.jpeg" alt="profile" />
        </div>
        <h2 class="name">Jessica Randall</h2>
        <p class="address">London, United Kingdom</p>
        <p class="job">"Front-end developer and avid reader."</p>
        <!-- links container   -->
        <div class="links-c">
          <a href="https://github.com">Github</a>
          <a href="https://frontendmentor.io">Frontend Mentor</a>
          <a href="https://linkedin.com">LinkedIn</a>
          <a href="https://x.com">Twitter</a>
          <a href="https://instagram.com">Instagram</a>
        </div>
      </article>
    </main>
  </body>
</html>
